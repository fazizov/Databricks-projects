    etl_bronze:
      name: etl-bronze
      queue:
        enabled: true

      tasks:
        - task_key: mssql-bronze
          notebook_task:
            notebook_path: /Workspace/Users/fikrat.azizov@slalom.com/Databricks-projects/POC-Cooley/Cooley_DAB/MSSQL-Bronze
