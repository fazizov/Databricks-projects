# Databricks Asset Bundle configuration, more info here: https://docs.databricks.com/en/dev-tools/bundles/settings.html
bundle:
  name: Cooley_DAB

include:
  - resources/*.yml
  - resources/*/*.yml

variables:
  catalog_name:
    default:  learn_adb_fikrat
targets:
  # The 'dev' target, for development purposes. This target is the default.
  dev:
    mode: development
    default: true
    workspace:
      host: https://adb-2052423850922793.13.azuredatabricks.net

  # The 'prod' target, used for production deployment.
  prod:
    mode: production
    workspace:
      host: https://adb-2052423850922793.13.azuredatabricks.net
      # We always use /Users/fikrat.azizov@slalom.com for all resources to make sure we only have a single copy.
      root_path: /Users/fikrat.azizov@slalom.com/.bundle/${bundle.name}/${bundle.target}
    run_as:
      # This runs as fikrat.azizov@slalom.com in production. We could also use a service principal here,
      # see https://docs.databricks.com/dev-tools/bundles/permissions.html.
      user_name: fikrat.azizov@slalom.com